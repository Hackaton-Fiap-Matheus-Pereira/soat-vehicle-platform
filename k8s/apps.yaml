apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service, namespace: soat}
spec:
  replicas: 2
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: api
          image: ghcr.io/OWNER/REPOSITORY-auth:latest
          ports: [{containerPort: 8000}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: soat-secrets, key: AUTH_DATABASE_URL}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: soat-secrets, key: JWT_SECRET}}
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom: {configMapKeyRef: {name: soat-config, key: BOOTSTRAP_ADMIN_EMAIL}}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: soat-secrets, key: BOOTSTRAP_ADMIN_PASSWORD}}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 20}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: auth-service, namespace: soat}
spec: {selector: {app: auth-service}, ports: [{port: 80, targetPort: 8000}], type: LoadBalancer}
---
