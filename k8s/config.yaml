apiVersion: v1
kind: Secret
metadata:
  name: soat-secrets
  namespace: soat
type: Opaque
stringData:
  JWT_SECRET: change-this-before-deploying
  MYSQL_ROOT_PASSWORD: root-change-me
  AUTH_DB_PASSWORD: auth-change-me
  VEHICLE_DB_PASSWORD: vehicle-change-me
  BOOTSTRAP_ADMIN_PASSWORD: Admin123!
  AUTH_DATABASE_URL: mysql+aiomysql://auth_user:auth-change-me@auth-db:3306/auth_db
  VEHICLE_DATABASE_URL: mysql+aiomysql://vehicle_user:vehicle-change-me@vehicle-db:3306/vehicle_db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soat-config
  namespace: soat
data:
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
