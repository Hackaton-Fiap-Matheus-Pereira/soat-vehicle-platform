[project]
name = "soat-vehicle-platform"
version = "1.0.0"
description = "API de revenda de veiculos - Tech Challenge SOAT Fase 3"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy[asyncio]==2.0.43",
  "aiomysql==0.2.0",
  "pymysql==1.1.2",
  "cryptography==45.0.7",
  "alembic==1.16.5",
  "pydantic-settings==2.10.1",
  "email-validator==2.2.0",
  "pwdlib[argon2]==0.2.1",
  "PyJWT==2.10.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "httpx==0.28.1",
  "aiosqlite==0.21.0",
  "ruff==0.12.12",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["auth_service*", "vehicle_service*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
