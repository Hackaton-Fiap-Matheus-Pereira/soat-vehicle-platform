name: CI-CD
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest -q
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Wait for APIs
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:8001/health >/dev/null \
              && curl --fail --silent http://localhost:8002/health >/dev/null \
              && exit 0
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Execute complete business flow
        shell: pwsh
        run: ./scripts/demo.ps1
      - if: always()
        run: docker compose logs
  build:
    if: github.event_name == 'push'
    needs: e2e
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      matrix: {service: [auth_service, vehicle_service]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          service="${{ matrix.service }}"
          suffix="vehicle"
          if [ "$service" = "auth_service" ]; then suffix="auth"; fi
          echo "name=ghcr.io/${repository}-${suffix}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster credentials
        shell: bash
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_BASE64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info
      - name: Apply secrets and configuration
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
          VEHICLE_DB_PASSWORD: ${{ secrets.VEHICLE_DB_PASSWORD }}
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          VEHICLE_DATABASE_URL: ${{ secrets.VEHICLE_DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n soat create secret generic soat-secrets \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=AUTH_DB_PASSWORD="$AUTH_DB_PASSWORD" \
            --from-literal=VEHICLE_DB_PASSWORD="$VEHICLE_DB_PASSWORD" \
            --from-literal=AUTH_DATABASE_URL="$AUTH_DATABASE_URL" \
            --from-literal=VEHICLE_DATABASE_URL="$VEHICLE_DATABASE_URL" \
            --from-literal=BOOTSTRAP_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n soat create configmap soat-config \
            --from-literal=BOOTSTRAP_ADMIN_EMAIL="$ADMIN_EMAIL" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n soat create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy commit to Kubernetes
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          sed -i "s|ghcr.io/OWNER/REPOSITORY-auth:latest|ghcr.io/${repository}-auth:${GITHUB_SHA}|" k8s/apps.yaml
          sed -i "s|ghcr.io/OWNER/REPOSITORY-vehicle:latest|ghcr.io/${repository}-vehicle:${GITHUB_SHA}|" k8s/apps.yaml
          kubectl apply -f k8s/databases.yaml
          kubectl apply -f k8s/apps.yaml
          kubectl -n soat rollout status deployment/auth-service --timeout=300s
          kubectl -n soat rollout status deployment/vehicle-service --timeout=300s
      - name: Verify deployment
        run: |
          kubectl -n soat get pods
          kubectl -n soat get services
