name: CI-CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest -q

  deploy-kind:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create temporary Kubernetes cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: soat-ci

      - name: Build application images
        run: |
          docker build --build-arg SERVICE=auth_service \
            -t soat-auth:${GITHUB_SHA} .
          docker build --build-arg SERVICE=vehicle_service \
            -t soat-vehicle:${GITHUB_SHA} .

      - name: Load images into Kind
        run: |
          kind load docker-image soat-auth:${GITHUB_SHA} --name soat-ci
          kind load docker-image soat-vehicle:${GITHUB_SHA} --name soat-ci

      - name: Configure test environment
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n soat create secret generic soat-secrets \
            --from-literal=JWT_SECRET=ci-secret-with-at-least-32-characters \
            --from-literal=MYSQL_ROOT_PASSWORD=root_pass \
            --from-literal=AUTH_DB_PASSWORD=auth_pass \
            --from-literal=VEHICLE_DB_PASSWORD=vehicle_pass \
            --from-literal=AUTH_DATABASE_URL=mysql+aiomysql://auth_user:auth_pass@auth-db:3306/auth_db \
            --from-literal=VEHICLE_DATABASE_URL=mysql+aiomysql://vehicle_user:vehicle_pass@vehicle-db:3306/vehicle_db \
            --from-literal=BOOTSTRAP_ADMIN_PASSWORD='Admin123!'
          kubectl -n soat create configmap soat-config \
            --from-literal=BOOTSTRAP_ADMIN_EMAIL=admin@example.com

      - name: Deploy databases and APIs
        run: |
          sed -i '/imagePullSecrets:/d' k8s/apps.yaml
          sed -i "s|ghcr.io/OWNER/REPOSITORY-auth:latest|soat-auth:${GITHUB_SHA}|" k8s/apps.yaml
          sed -i "s|ghcr.io/OWNER/REPOSITORY-vehicle:latest|soat-vehicle:${GITHUB_SHA}|" k8s/apps.yaml
          kubectl apply -f k8s/databases.yaml
          kubectl -n soat rollout status statefulset/auth-db --timeout=300s
          kubectl -n soat rollout status statefulset/vehicle-db --timeout=300s
          kubectl apply -f k8s/apps.yaml
          kubectl -n soat rollout status deployment/auth-service --timeout=300s
          kubectl -n soat rollout status deployment/vehicle-service --timeout=300s

      - name: Test deployed application
        shell: pwsh
        run: |
          kubectl -n soat port-forward service/auth-service 8001:80 *> auth-port-forward.log &
          kubectl -n soat port-forward service/vehicle-service 8002:80 *> vehicle-port-forward.log &
          Start-Sleep -Seconds 10
          ./scripts/demo.ps1

      - name: Show Kubernetes evidence
        if: always()
        run: |
          kubectl -n soat get all
          kubectl -n soat get pvc
          kubectl -n soat describe pods
          kubectl -n soat logs deployment/auth-service --all-pods=true --tail=100 || true
          kubectl -n soat logs deployment/vehicle-service --all-pods=true --tail=100 || true

  publish:
    if: github.event_name == 'push'
    needs: deploy-kind
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth_service, vehicle_service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          suffix="vehicle"
          if [ "${{ matrix.service }}" = "auth_service" ]; then suffix="auth"; fi
          echo "name=ghcr.io/${repository}-${suffix}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
